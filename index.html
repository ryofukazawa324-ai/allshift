<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全スタッフ シフト確認・月間検索</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:22px auto 40px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 32px rgba(15,23,42,.08)}h1{font-size:25px;margin:0 0 5px}.sub{font-size:13px;color:#64748b;margin:0 0 20px}.saved{padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:12px}.saved b{display:block;font-size:14px}.saved small{color:#64748b}.fileLabel,button{display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:800;text-align:center;cursor:pointer}.fileLabel{background:#eaf2ff;color:#175cd3}input[type=file]{display:none}.status{font-size:13px;padding:11px 13px;border-radius:12px;background:#f1f5f9;margin:12px 0 18px;line-height:1.5}.status.ok{background:#ecfdf3;color:#067647}.status.error{background:#fef3f2;color:#b42318}.field{margin:14px 0}.field label{display:block;font-weight:800;margin:0 0 7px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:17px}.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 16px}.quick button{padding:11px 8px;background:#f1f5f9;color:#334155;font-size:14px}.result{margin-top:18px}.titleRow{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.titleRow h2{font-size:20px;margin:0}.count{font-size:13px;color:#64748b;white-space:nowrap}.list{border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 15px;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.name{font-weight:800}.shift{min-width:72px;text-align:center;padding:7px 10px;border-radius:999px;background:#eef2ff;font-weight:800}.empty{padding:24px;text-align:center;color:#64748b}.note{font-size:12px;color:#64748b;line-height:1.6;margin-top:15px}.modeTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #e2e8f0}.modeTab{background:#f1f5f9;color:#475569}.modeTab.active{background:#175cd3;color:#fff}.modePanel[hidden]{display:none}.searchRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.searchRow .field{margin:14px 0 0}.searchBtn{width:auto;min-width:92px;background:#175cd3;color:#fff;padding:14px 18px}.monthResult{margin-top:18px}.personBlock{margin-top:16px}.personBlock h3{font-size:17px;margin:0 0 8px}.monthTableWrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}.monthTable{border-collapse:collapse;min-width:max-content;width:100%;font-size:13px}.monthTable th,.monthTable td{padding:9px 10px;border-right:1px solid #eef2f6;border-bottom:1px solid #eef2f6;text-align:center;white-space:nowrap}.monthTable th:last-child,.monthTable td:last-child{border-right:0}.monthTable tr:last-child td{border-bottom:0}.monthTable th{background:#f8fafc;color:#475569;font-weight:800;position:sticky;top:0}.monthTable td.off{color:#94a3b8;background:#fafafa}.monthTable td.work{font-weight:800;color:#1e3a8a}.monthHint{font-size:12px;color:#64748b;margin:7px 0 0}.matchCount{font-size:13px;color:#64748b;margin-top:10px}.monthManager{margin:14px 0 18px;padding:14px;border:1px solid #dbeafe;background:#f8fbff;border-radius:15px}.monthManager label{display:block;font-weight:800;margin-bottom:7px}.monthManagerRow{display:grid;grid-template-columns:1fr auto;gap:8px}.monthSelect{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px}.monthDelete{width:auto;padding:11px 14px;background:#fff1f2;color:#be123c}.monthMeta{margin-top:8px;font-size:12px;color:#64748b}.monthManager .fileLabel{margin-top:10px}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>全スタッフ シフト確認</h1><p class="sub">Excelを一度登録すれば、次回から日付を選ぶだけで確認できます。</p>
<div id="saved" class="saved" hidden><small>現在のシフト表</small><b id="savedName"></b><small id="savedAt"></small></div>
<div class="monthManager">
<label for="monthSelect">シフト表の月</label>
<div class="monthManagerRow"><select id="monthSelect" class="monthSelect"></select><button id="deleteMonthBtn" class="monthDelete" type="button">この月を削除</button></div>
<div id="monthMeta" class="monthMeta">登録済みの月はありません。</div>
<label class="fileLabel" for="excelFile" id="fileLabel">この月のシフト表Excelを登録</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm">
</div>
<div id="status" class="status">月を選んでシフト表Excelを登録してください。</div>
<div class="modeTabs">
  <button id="dailyTab" class="modeTab active" type="button">本日の出勤者</button>
  <button id="monthTab" class="modeTab" type="button">月間シフト検索</button>
</div>
<div id="dailyPanel" class="modePanel">
  <div class="field"><label for="targetDate">確認する日付</label><input id="targetDate" type="date"></div>
  <div class="quick"><button id="prevBtn" type="button">← 前日</button><button id="todayBtn" type="button">今日</button><button id="nextBtn" type="button">翌日 →</button></div>
  <div id="result" class="result" hidden><div class="titleRow"><h2 id="resultTitle"></h2><span id="count" class="count"></span></div><div id="staffList" class="list"></div></div>
  <p class="note">部門に関係なく、その日に勤務している全スタッフを同じ表示で一覧にします。公休・有休などは除外します。</p>
</div>
<div id="monthPanel" class="modePanel" hidden>
  <div class="searchRow">
    <div class="field"><label for="nameSearch">名前に含む文字列</label><input id="nameSearch" type="text" placeholder="例：深澤、田、佐々木"></div>
    <button id="monthSearchBtn" class="searchBtn" type="button">検索</button>
  </div>
  <div class="monthHint">入力した文字を名前に含むスタッフをすべて検索し、その月のシフトを一気に表示します。</div>
  <div id="monthResult" class="monthResult"></div>
</div>
<p class="note">翌月は新しいExcelに更新するだけで使えます。登録したExcelはこの端末のブラウザ内に保存されます。</p>
</section></main>
<script>
(()=>{
const SHEET_NAME="3）入力用";
const DB_NAME="ShiftViewerAllDB", STORE="files", LEGACY_KEY="currentShiftAll";
const fileInput=document.getElementById('excelFile'),monthSelect=document.getElementById('monthSelect'),monthMeta=document.getElementById('monthMeta'),deleteMonthBtn=document.getElementById('deleteMonthBtn'), dateInput=document.getElementById('targetDate'), statusBox=document.getElementById('status'), result=document.getElementById('result'), resultTitle=document.getElementById('resultTitle'), count=document.getElementById('count'), staffList=document.getElementById('staffList'), saved=document.getElementById('saved'), savedName=document.getElementById('savedName'), savedAt=document.getElementById('savedAt'), fileLabel=document.getElementById('fileLabel'), dailyTab=document.getElementById('dailyTab'), monthTab=document.getElementById('monthTab'), dailyPanel=document.getElementById('dailyPanel'), monthPanel=document.getElementById('monthPanel'), nameSearch=document.getElementById('nameSearch'), monthSearchBtn=document.getElementById('monthSearchBtn'), monthResult=document.getElementById('monthResult');
let rows=null, headerRow=-1, nameCol=-1, codeCol=-1, dates=[];
const clean=v=>v==null?'':String(v).trim();
const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function serialISO(v){const p=XLSX.SSF.parse_date_code(Number(v));return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:null}
function valueISO(v){if(v instanceof Date&&!isNaN(v))return localISO(v);if(typeof v==='number'&&v>30000&&v<80000)return serialISO(v);if(typeof v==='string'){let m=v.trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}return null}
function isCode(v){return typeof v==='number'?Number.isFinite(v):typeof v==='string'&&/^\d+$/.test(v.trim())}
function setStatus(t,c=''){statusBox.className=`status ${c}`.trim();statusBox.textContent=t}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function monthKey(ym){return `shift:${ym}`}
async function saveFile(data,name,ym){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({data,name,ym,savedAt:new Date().toISOString()},monthKey(ym));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function loadFile(ym){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(monthKey(ym));q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function deleteFile(ym){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(monthKey(ym));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function listMonths(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).getAllKeys();q.onsuccess=()=>res((q.result||[]).filter(k=>String(k).startsWith('shift:')).map(k=>String(k).slice(6)).sort());q.onerror=()=>rej(q.error)})}
async function migrateLegacy(){const db=await openDB();return new Promise((res)=>{const tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE),q=st.get(LEGACY_KEY);q.onsuccess=async()=>{const x=q.result;if(!x){res();return}try{const wb=XLSX.read(x.data,{type:'array',cellDates:true,cellFormula:true});const sh=wb.Sheets[SHEET_NAME];if(!sh){res();return}const tmp=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=findLayout(tmp);const ym=l.ds[0]?.iso?.slice(0,7);if(ym)st.put({...x,ym},monthKey(ym));st.delete(LEGACY_KEY)}catch{};tx.oncomplete=()=>res();tx.onerror=()=>res()};q.onerror=()=>res()})}
function monthLabel(ym){const [y,m]=ym.split('-');return `${y}年${Number(m)}月`}
async function refreshMonthSelect(prefer){const months=await listMonths();const now=localISO(new Date()).slice(0,7);const all=[...new Set([...months,prefer||now])].sort();monthSelect.innerHTML=all.map(ym=>`<option value="${ym}">${monthLabel(ym)}${months.includes(ym)?' ✓':''}</option>`).join('');monthSelect.value=prefer&&all.includes(prefer)?prefer:(months.includes(now)?now:(months.at(-1)||now));await loadSelectedMonth()}
async function loadSelectedMonth(){const ym=monthSelect.value;const x=await loadFile(ym);rows=null;dates=[];result.hidden=true;monthResult.innerHTML='';if(x){await parse(x.data,x.name,x.savedAt);monthMeta.textContent=`${monthLabel(ym)}：${x.name} を保存済み`;fileLabel.textContent='この月のシフト表Excelを更新';deleteMonthBtn.disabled=false}else{saved.hidden=true;monthMeta.textContent=`${monthLabel(ym)}：未登録`;fileLabel.textContent='この月のシフト表Excelを登録';deleteMonthBtn.disabled=true;setStatus('この月のExcelは未登録です。','');const [y,m]=ym.split('-').map(Number);dateInput.min=`${ym}-01`;dateInput.max=`${ym}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;dateInput.value=`${ym}-01`}}
function findLayout(data){let hr=-1,nc=-1,cc=-1;for(let r=0;r<Math.min(data.length,100);r++){for(let c=0;c<(data[r]||[]).length;c++){if(clean(data[r][c]).includes('担当者名')){hr=r;nc=c;break}}if(hr>=0)break}if(hr<0)throw new Error('「担当者名」の列を見つけられませんでした。');for(let c=0;c<(data[hr]||[]).length;c++){if(clean(data[hr][c])==='CD'){cc=c;break}}if(cc<0)cc=Math.max(0,nc-2);const map=new Map();for(let r=Math.max(0,hr-2);r<=Math.min(data.length-1,hr+2);r++){for(let c=0;c<(data[r]||[]).length;c++){const iso=valueISO(data[r][c]);if(iso&&!map.has(iso))map.set(iso,c)}}const ds=[...map].map(([iso,col])=>({iso,col})).sort((a,b)=>a.iso.localeCompare(b.iso));if(!ds.length)throw new Error('日付列を見つけられませんでした。');return{hr,nc,cc,ds}}
async function parse(data,name,when){const wb=XLSX.read(data,{type:'array',cellDates:true,cellFormula:true});const sh=wb.Sheets[SHEET_NAME];if(!sh)throw new Error(`「${SHEET_NAME}」シートがありません。`);rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=findLayout(rows);headerRow=l.hr;nameCol=l.nc;codeCol=l.cc;dates=l.ds;dateInput.min=dates[0].iso;dateInput.max=dates.at(-1).iso;const today=localISO(new Date());const selectedYM=monthSelect.value;dateInput.value=dates.some(x=>x.iso===today)&&today.startsWith(selectedYM)?today:dates[0].iso;saved.hidden=false;savedName.textContent=name;savedAt.textContent=when?`保存日時：${new Date(when).toLocaleString('ja-JP')}`:'';fileLabel.textContent='この月のシフト表Excelを更新';setStatus(`使用中：${dates[0].iso.replaceAll('-','/')} ～ ${dates.at(-1).iso.replaceAll('-','/')}`,'ok');show()}
function escapeHTML(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function isLeaveShift(shift){const leave=['休','公休','有休','有給','希望休','欠勤','休日','振休','代休'];return !shift||leave.some(w=>shift===w||shift.includes(w))}
function allPeople(){const people=[];if(!rows)return people;for(let r=headerRow+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameCol]),code=row[codeCol];if(!name||!isCode(code))continue;people.push({name,row})}return people}
function switchMode(mode){const monthly=mode==='month';dailyPanel.hidden=monthly;monthPanel.hidden=!monthly;dailyTab.classList.toggle('active',!monthly);monthTab.classList.toggle('active',monthly);if(monthly){nameSearch.focus();if(nameSearch.value.trim())showMonthSearch()}}
function formatDayLabel(iso){const d=new Date(`${iso}T00:00:00`),wd=['日','月','火','水','木','金','土'][d.getDay()];return `${d.getDate()}(${wd})`}
function showMonthSearch(){if(!rows){monthResult.innerHTML='<div class="empty">先にシフト表Excelを登録してください。</div>';return}const q=nameSearch.value.trim();if(!q){monthResult.innerHTML='<div class="empty">検索する文字を入力してください。</div>';return}const matched=allPeople().filter(p=>p.name.includes(q));if(!matched.length){monthResult.innerHTML=`<div class="empty">「${escapeHTML(q)}」を含むスタッフは見つかりませんでした。</div>`;return}const head=dates.map(d=>`<th>${formatDayLabel(d.iso)}</th>`).join('');const blocks=matched.map(p=>{const cells=dates.map(d=>{const shift=clean(p.row[d.col]);if(!shift)return '<td class="off">—</td>';const cls=isLeaveShift(shift)?'off':'work';return `<td class="${cls}">${escapeHTML(shift)}</td>`}).join('');return `<div class="personBlock"><h3>${escapeHTML(p.name)}</h3><div class="monthTableWrap"><table class="monthTable"><thead><tr>${head}</tr></thead><tbody><tr>${cells}</tr></tbody></table></div></div>`}).join('');monthResult.innerHTML=`<div class="matchCount">${matched.length}名ヒット</div>${blocks}`}
function show(){if(!rows)return;const target=dateInput.value,di=dates.find(d=>d.iso===target);result.hidden=false;if(!di){resultTitle.textContent='該当日なし';count.textContent='';staffList.innerHTML='<div class="empty">このExcelにその日付はありません。</div>';return}let people=[];for(let r=headerRow+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameCol]),code=row[codeCol];if(!name||!isCode(code))continue;const shift=clean(row[di.col]);if(!isLeaveShift(shift))people.push({name,shift})}const d=new Date(`${target}T00:00:00`),wd=['日','月','火','水','木','金','土'][d.getDay()];resultTitle.textContent=`${d.getMonth()+1}月${d.getDate()}日（${wd}）`;count.textContent=`出勤 ${people.length}名`;staffList.innerHTML=people.length?people.map(p=>`<div class="row"><div class="name">${escapeHTML(p.name)}</div><div class="shift">${escapeHTML(p.shift)}</div></div>`).join(''):'<div class="empty">出勤者が見つかりませんでした。</div>'}
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;try{setStatus('Excelを読み込んでいます…');const data=await f.arrayBuffer();const wb=XLSX.read(data,{type:'array',cellDates:true,cellFormula:true});const sh=wb.Sheets[SHEET_NAME];if(!sh)throw new Error(`「${SHEET_NAME}」シートがありません。`);const tmp=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=findLayout(tmp);const fileYM=l.ds[0].iso.slice(0,7);await saveFile(data,f.name,fileYM);await refreshMonthSelect(fileYM);setStatus(`${monthLabel(fileYM)}のシフト表を保存しました。`,'ok')}catch(e){setStatus(`読み込みエラー：${e.message}`,'error')}finally{fileInput.value=''}});
monthSelect.addEventListener('change',loadSelectedMonth);deleteMonthBtn.addEventListener('click',async()=>{const ym=monthSelect.value;if(!confirm(`${monthLabel(ym)}の保存済みExcelを削除しますか？`))return;await deleteFile(ym);await refreshMonthSelect(ym);setStatus(`${monthLabel(ym)}のExcelを削除しました。`,'ok')});
dailyTab.addEventListener('click',()=>switchMode('daily'));monthTab.addEventListener('click',()=>switchMode('month'));monthSearchBtn.addEventListener('click',showMonthSearch);nameSearch.addEventListener('keydown',e=>{if(e.key==='Enter')showMonthSearch()});
dateInput.addEventListener('change',show);document.getElementById('todayBtn').onclick=()=>{const t=localISO(new Date());if(t>=dateInput.min&&t<=dateInput.max){dateInput.value=t;show()}};function move(n){if(!dateInput.value)return;const d=new Date(`${dateInput.value}T00:00:00`);d.setDate(d.getDate()+n);const v=localISO(d);if(v>=dateInput.min&&v<=dateInput.max){dateInput.value=v;show()}}document.getElementById('prevBtn').onclick=()=>move(-1);document.getElementById('nextBtn').onclick=()=>move(1);
dateInput.value=localISO(new Date());(async()=>{try{await migrateLegacy();await refreshMonthSelect(localISO(new Date()).slice(0,7))}catch(e){setStatus('保存済みExcelを読み込めませんでした。再登録してください。','error')}})();
})();
</script></body></html>
