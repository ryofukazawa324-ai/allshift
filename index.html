<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>全スタッフ シフト確認</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:22px auto 40px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 32px rgba(15,23,42,.08)}h1{font-size:25px;margin:0 0 5px}.sub{font-size:13px;color:#64748b;margin:0 0 20px}.saved{padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:12px}.saved b{display:block;font-size:14px}.saved small{color:#64748b}.fileLabel,button{display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:800;text-align:center;cursor:pointer}.fileLabel{background:#eaf2ff;color:#175cd3}input[type=file]{display:none}.status{font-size:13px;padding:11px 13px;border-radius:12px;background:#f1f5f9;margin:12px 0 18px;line-height:1.5}.status.ok{background:#ecfdf3;color:#067647}.status.error{background:#fef3f2;color:#b42318}.field{margin:14px 0}.field label{display:block;font-weight:800;margin:0 0 7px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:17px}.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 16px}.quick button{padding:11px 8px;background:#f1f5f9;color:#334155;font-size:14px}.result{margin-top:18px}.titleRow{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.titleRow h2{font-size:20px;margin:0}.count{font-size:13px;color:#64748b;white-space:nowrap}.list{border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 15px;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.name{font-weight:800}.shift{min-width:72px;text-align:center;padding:7px 10px;border-radius:999px;background:#eef2ff;font-weight:800}.empty{padding:24px;text-align:center;color:#64748b}.note{font-size:12px;color:#64748b;line-height:1.6;margin-top:15px}.modeTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #e2e8f0}.modeTab{background:#f1f5f9;color:#475569}.modeTab.active{background:#175cd3;color:#fff}.modePanel[hidden]{display:none}.searchRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.searchRow .field{margin:14px 0 0}.searchBtn{width:auto;min-width:92px;background:#175cd3;color:#fff;padding:14px 18px}.monthResult{margin-top:18px}.personBlock{margin-top:16px}.personBlock h3{font-size:17px;margin:0 0 8px}.monthTableWrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}.monthTable{border-collapse:collapse;min-width:max-content;width:100%;font-size:13px}.monthTable th,.monthTable td{padding:9px 10px;border-right:1px solid #eef2f6;border-bottom:1px solid #eef2f6;text-align:center;white-space:nowrap}.monthTable th:last-child,.monthTable td:last-child{border-right:0}.monthTable tr:last-child td{border-bottom:0}.monthTable th{background:#f8fafc;color:#475569;font-weight:800}.monthTable td.off{color:#94a3b8;background:#fafafa}.monthTable td.work{font-weight:800;color:#1e3a8a}.monthHint{font-size:12px;color:#64748b;margin:7px 0 0}.matchCount{font-size:13px;color:#64748b;margin-top:10px}.monthManager{margin:14px 0 18px;padding:14px;border:1px solid #dbeafe;background:#f8fbff;border-radius:15px}.monthManager label{display:block;font-weight:800;margin-bottom:7px}.monthManagerRow{display:grid;grid-template-columns:1fr auto;gap:8px}.monthSelect{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px}.monthDelete{width:auto;padding:11px 14px;background:#fff1f2;color:#be123c}.monthMeta{margin-top:8px;font-size:12px;color:#64748b}.monthManager .fileLabel{margin-top:10px}.refreshBtn{margin:10px 0 0;background:#f1f5f9;color:#334155;font-size:14px;padding:11px 14px}.version{font-size:11px;color:#94a3b8;text-align:center;margin-top:8px}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>全スタッフ シフト確認</h1><p class="sub">1〜12月から月を選び、その月専用のExcelを登録して使います。</p>
<div id="saved" class="saved" hidden><small>現在のシフト表</small><b id="savedName"></b><small id="savedAt"></small></div>
<div class="monthManager">
<label for="monthSelect">使用する月</label>
<div class="monthManagerRow"><select id="monthSelect" class="monthSelect"></select><button id="deleteMonthBtn" class="monthDelete" type="button">この月を削除</button></div>
<div id="monthMeta" class="monthMeta"></div>
<label class="fileLabel" for="excelFile" id="fileLabel">この月のシフト表Excelを登録</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm">
</div>
<div id="status" class="status">月を選んで、その月に使うExcelを登録してください。</div>
<button id="refreshLatestBtn" class="refreshBtn" type="button">最新版を再読み込み</button><div class="version">月手動選択版 2026-08-26</div>
<div class="modeTabs"><button id="dailyTab" class="modeTab active" type="button">本日の出勤者</button><button id="monthTab" class="modeTab" type="button">月間シフト検索</button></div>
<div id="dailyPanel" class="modePanel"><div class="field"><label for="targetDate">確認する日付</label><input id="targetDate" type="date"></div><div class="quick"><button id="prevBtn" type="button">← 前日</button><button id="todayBtn" type="button">今日</button><button id="nextBtn" type="button">翌日 →</button></div><div id="result" class="result" hidden><div class="titleRow"><h2 id="resultTitle"></h2><span id="count" class="count"></span></div><div id="staffList" class="list"></div></div></div>
<div id="monthPanel" class="modePanel" hidden><div class="searchRow"><div class="field"><label for="nameSearch">名前に含む文字列</label><input id="nameSearch" type="text" placeholder="例：深澤、田、佐々木"></div><button id="monthSearchBtn" class="searchBtn" type="button">検索</button></div><div class="monthHint">選択中の月に登録したExcelから検索します。</div><div id="monthResult" class="monthResult"></div></div>
<p class="note">Excel内の日付から月を自動判定しません。8月を選んで登録したExcelは、必ず8月用として保存されます。</p>
</section></main>
<script>
(()=>{
const SHEET_NAME='3）入力用',DB_NAME='ShiftViewerAllDB',STORE='files';
const $=id=>document.getElementById(id),fileInput=$('excelFile'),monthSelect=$('monthSelect'),monthMeta=$('monthMeta'),deleteMonthBtn=$('deleteMonthBtn'),dateInput=$('targetDate'),statusBox=$('status'),result=$('result'),resultTitle=$('resultTitle'),count=$('count'),staffList=$('staffList'),saved=$('saved'),savedName=$('savedName'),savedAt=$('savedAt'),fileLabel=$('fileLabel'),dailyTab=$('dailyTab'),monthTab=$('monthTab'),dailyPanel=$('dailyPanel'),monthPanel=$('monthPanel'),nameSearch=$('nameSearch'),monthSearchBtn=$('monthSearchBtn'),monthResult=$('monthResult');
let rows=null,headerRow=-1,nameCol=-1,codeCol=-1,dates=[];
monthSelect.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');monthSelect.value=String(new Date().getMonth()+1);
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if('caches'in window)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{});$('refreshLatestBtn').onclick=()=>{const u=new URL(location.href);u.searchParams.set('_refresh',Date.now());location.replace(u)};
const clean=v=>v==null?'':String(v).trim(),localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function serialISO(v){const p=XLSX.SSF.parse_date_code(Number(v));return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:null}function valueISO(v){if(v instanceof Date&&!isNaN(v))return localISO(v);if(typeof v==='number'&&v>30000&&v<80000)return serialISO(v);if(typeof v==='string'){const m=v.trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}return null}function isCode(v){return typeof v==='number'?Number.isFinite(v):typeof v==='string'&&/^\d+$/.test(v.trim())}function setStatus(t,c=''){statusBox.className=`status ${c}`.trim();statusBox.textContent=t}function key(){return`manual-month:${monthSelect.value}`}function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function putFile(data,name){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({data,name,savedAt:new Date().toISOString()},key());tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function getFile(){const db=await openDB();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(key());q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}async function delFile(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key());tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function findLayout(data){let hr=-1,nc=-1,cc=-1;for(let r=0;r<Math.min(data.length,100);r++){for(let c=0;c<(data[r]||[]).length;c++)if(clean(data[r][c]).includes('担当者名')){hr=r;nc=c;break}if(hr>=0)break}if(hr<0)throw Error('「担当者名」の列を見つけられませんでした。');for(let c=0;c<(data[hr]||[]).length;c++)if(clean(data[hr][c])==='CD'){cc=c;break}if(cc<0)cc=Math.max(0,nc-2);const map=new Map();for(let r=Math.max(0,hr-2);r<=Math.min(data.length-1,hr+2);r++)for(let c=0;c<(data[r]||[]).length;c++){const iso=valueISO(data[r][c]);if(iso&&!map.has(iso))map.set(iso,c)}const ds=[...map].map(([iso,col])=>({iso,col})).sort((a,b)=>a.iso.localeCompare(b.iso));if(!ds.length)throw Error('日付列を見つけられませんでした。');return{hr,nc,cc,ds}}
async function parse(data,name,when){const wb=XLSX.read(data,{type:'array',cellDates:true,cellFormula:true}),sh=wb.Sheets[SHEET_NAME];if(!sh)throw Error(`「${SHEET_NAME}」シートがありません。`);rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=findLayout(rows);headerRow=l.hr;nameCol=l.nc;codeCol=l.cc;dates=l.ds;dateInput.min=dates[0].iso;dateInput.max=dates.at(-1).iso;const today=localISO(new Date());dateInput.value=dates.some(x=>x.iso===today)?today:dates[0].iso;saved.hidden=false;savedName.textContent=name;savedAt.textContent=when?`保存日時：${new Date(when).toLocaleString('ja-JP')}`:'';monthMeta.textContent=`${monthSelect.value}月：${name} を使用中`;fileLabel.textContent=`${monthSelect.value}月のExcelを更新`;deleteMonthBtn.disabled=false;setStatus(`${monthSelect.value}月用Excelを使用中`,'ok');show()}
async function loadSelected(){rows=null;dates=[];result.hidden=true;monthResult.innerHTML='';const x=await getFile();if(x)await parse(x.data,x.name,x.savedAt);else{saved.hidden=true;monthMeta.textContent=`${monthSelect.value}月：未登録`;fileLabel.textContent=`${monthSelect.value}月のExcelを登録`;deleteMonthBtn.disabled=true;setStatus(`${monthSelect.value}月のExcelは未登録です。`)}}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function leave(s){return !s||['休','公休','有休','有給','希望休','欠勤','休日','振休','代休'].some(w=>s===w||s.includes(w))}function people(){const a=[];if(!rows)return a;for(let r=headerRow+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameCol]);if(name&&isCode(row[codeCol]))a.push({name,row})}return a}function show(){if(!rows)return;const di=dates.find(d=>d.iso===dateInput.value);result.hidden=false;if(!di){resultTitle.textContent='該当日なし';count.textContent='';staffList.innerHTML='<div class="empty">このExcelにその日付はありません。</div>';return}const ps=people().map(p=>({name:p.name,shift:clean(p.row[di.col])})).filter(p=>!leave(p.shift)),d=new Date(`${dateInput.value}T00:00:00`),wd=['日','月','火','水','木','金','土'][d.getDay()];resultTitle.textContent=`${d.getMonth()+1}月${d.getDate()}日（${wd}）`;count.textContent=`出勤 ${ps.length}名`;staffList.innerHTML=ps.length?ps.map(p=>`<div class="row"><div class="name">${esc(p.name)}</div><div class="shift">${esc(p.shift)}</div></div>`).join(''):'<div class="empty">出勤者が見つかりませんでした。</div>'}function showMonth(){if(!rows){monthResult.innerHTML='<div class="empty">この月のExcelを登録してください。</div>';return}const q=nameSearch.value.trim();if(!q){monthResult.innerHTML='<div class="empty">検索する文字を入力してください。</div>';return}const matched=people().filter(p=>p.name.includes(q));if(!matched.length){monthResult.innerHTML='<div class="empty">該当スタッフなし</div>';return}const head=dates.map(d=>{const x=new Date(`${d.iso}T00:00:00`);return`<th>${x.getDate()}日</th>`}).join('');monthResult.innerHTML=`<div class="matchCount">${matched.length}名ヒット</div>`+matched.map(p=>`<div class="personBlock"><h3>${esc(p.name)}</h3><div class="monthTableWrap"><table class="monthTable"><thead><tr>${head}</tr></thead><tbody><tr>${dates.map(d=>{const s=clean(p.row[d.col]);return`<td class="${leave(s)?'off':'work'}">${esc(s||'—')}</td>`}).join('')}</tr></tbody></table></div></div>`).join('')}
fileInput.onchange=async()=>{const f=fileInput.files?.[0];if(!f)return;try{setStatus(`${monthSelect.value}月用として保存中…`);const data=await f.arrayBuffer();await putFile(data,f.name);await loadSelected();setStatus(`${monthSelect.value}月用として保存しました。`,'ok')}catch(e){setStatus(`読み込みエラー：${e.message}`,'error')}finally{fileInput.value=''}};monthSelect.onchange=loadSelected;deleteMonthBtn.onclick=async()=>{if(!confirm(`${monthSelect.value}月の登録Excelを削除しますか？`))return;await delFile();await loadSelected()};dailyTab.onclick=()=>{dailyPanel.hidden=false;monthPanel.hidden=true;dailyTab.classList.add('active');monthTab.classList.remove('active')};monthTab.onclick=()=>{dailyPanel.hidden=true;monthPanel.hidden=false;dailyTab.classList.remove('active');monthTab.classList.add('active')};monthSearchBtn.onclick=showMonth;nameSearch.onkeydown=e=>{if(e.key==='Enter')showMonth()};dateInput.onchange=show;$('todayBtn').onclick=()=>{const t=localISO(new Date());if(t>=dateInput.min&&t<=dateInput.max){dateInput.value=t;show()}};function move(n){if(!dateInput.value)return;const d=new Date(`${dateInput.value}T00:00:00`);d.setDate(d.getDate()+n);const v=localISO(d);if(v>=dateInput.min&&v<=dateInput.max){dateInput.value=v;show()}}$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);loadSelected().catch(e=>setStatus(`読み込みエラー：${e.message}`,'error'));
})();
</script></body></html>
