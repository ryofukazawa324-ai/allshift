<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>全スタッフ シフト確認</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:22px auto 40px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 32px #0f172a14}h1{font-size:25px;margin:0 0 5px}.sub,.note,.hint,.meta{font-size:12px;color:#64748b;line-height:1.6}.saved,.manager{padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;margin:12px 0}.saved b{display:block}.manager{border-color:#dbeafe;background:#f8fbff}.managerRow{display:grid;grid-template-columns:1fr auto;gap:8px}.monthSelect,input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:16px}.fileLabel,button{display:block;width:100%;border:0;border-radius:13px;padding:13px 15px;font-size:15px;font-weight:800;text-align:center;cursor:pointer}.fileLabel{background:#eaf2ff;color:#175cd3;margin-top:10px}input[type=file]{display:none}.delete{width:auto;background:#fff1f2;color:#be123c}.status{font-size:13px;padding:11px 13px;border-radius:12px;background:#f1f5f9;margin:12px 0}.status.ok{background:#ecfdf3;color:#067647}.status.error{background:#fef3f2;color:#b42318}.refresh{background:#f1f5f9;color:#334155}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid #e2e8f0}.tab{background:#f1f5f9;color:#475569}.tab.active{background:#175cd3;color:#fff}.panel[hidden]{display:none}.field{margin:14px 0}.field label,.manager label{display:block;font-weight:800;margin-bottom:7px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{background:#f1f5f9;color:#334155;padding:11px 8px}.re ></div><div class="manager"><label>使用する月</label><div class="managerRow"><select id="monthSelect" class="monthSelect"></select><button id="deleteMonthBtn" class="delete">この月を削除</button></div><div id="monthMeta" class="meta"></div><label class="fileLabel" for="excelFile" id="fileLabel">この月のシフト表Excelを登録</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm"></div><div id="status" class="status">月を選んでExcelを登録してください。</div><button id="refreshLatestBtn" class="refresh">最新版を再読み込み</button><div class="tabs"><button id="dailyTab" class="tab active">本日の出勤者</button><button id="monthTab" class="tab">月間シフト検索</button></div><div id="dailyPanel" class="panel"><div class="field"><label>確認する日付</label><input id="targetDate" type="date"></div><div class="quick"><button id="prevBtn">← 前日</button><button id="todayBtn">今日</button><button id="nextBtn">翌日 →</button></div><div id="result" class="result" hidden><div class="titleRow"><h2 id="resultTitle"></h2><span id="count" class="count"></span></div><div id="staffList" class="list"></div></div></div><div id="monthPanel" class="panel" hidden><div class="searchRow"><div class="field"><label>スタッフ名</label><input id="nameSearch" type="text" placeholder="例：深澤、中田"></div><button id="monthSearchBtn" class="searchBtn">検索</button></div><div class="hint">複数人は「、」や「,」で区切って入力できます。検索したスタッフごとにカレンダーを縦に表示します。</div><div id="monthResult"></div></div><p class="note">Excelは端末内に保存され、登録済みの月は次回からそのまま使えます。</p></section></main><script>(()=>{const SHEET='3）入力用',DB='ShiftViewerAllDB',STORE='files',URL='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',$=id=>document.getElementById(id),file=$('excelFile'),month=$('monthSelect'),meta=$('monthMeta'),del=$('deleteMonthBtn'),date=$('targetDate'),status=$('status'),result=$('result'),title=$('resultTitle'),count=$('count'),list=$('staffList'),saved=$('saved'),savedName=$('savedName'),savedAt=$('savedAt'),fileLabel=$('fileLabel'),dailyTab=$('dailyTab'),monthTab=$('monthTab'),dailyPanel=$('dailyPanel'),monthPanel=$('monthPanel'),nameSearch=$('nameSearch'),monthResult=$('monthResult');let rows=null,hr=-1,nc=-1,cc=-1,dates=[],loading=null;month.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');month.value=String(new Date().getMonth()+1);const clean=v=>v==null?'':String(v).trim(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),leave=s=>!s||['休','公休','有休','有給','希望休','欠勤','休日','振休','代休'].some(w=>s===w||s.includes(w)),key=()=>`manual-month:${month.value}`;function setStatus(t,c=''){status.className=`status ${c}`.trim();status.textContent=t}function loadX(){if(window.XLSX)return Promise.resolve();if(loading)return loading;loading=new Promise((ok,no)=>{const s=document.createElement('script');s.src=URL;s.onload=ok;s.onerror=()=>no(Error('Excel解析ライブラリを読み込めません'));document.head.appendChild(s)});return loading}function openDB(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function put(x){const db=await openDB();return new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(x,key());tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}async function get(){const db=await openDB();return new Promise((ok,no)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(key());q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)})}async function remove(){const db=await openDB();return new Promise((ok,no)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key());tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}function valISO(v){if(v instanceof Date&&!isNaN(v))return iso(v);if(typeof v==='number'&&v>30000&&v<80000){const p=XLSX.SSF.parse_date_code(v);return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:null}if(typeof v==='string'){const m=v.trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}return null}function isCode(v){return typeof v==='number'?Number.isFinite(v):typeof v==='string'&&/^\d+$/.test(v.trim())}function layout(data){let H=-1,N=-1,C=-1;for(let r=0;r<Math.min(data.length,100);r++){for(let c=0;c<(data[r]||[]).length;c++)if(clean(data[r][c]).includes('担当者名')){H=r;N=c;break}if(H>=0)break}if(H<0)throw Error('担当者名の列が見つかりません');for(let c=0;c<(data[H]||[]).length;c++)if(clean(data[H][c])==='CD'){C=c;break}if(C<0)C=Math.max(0,N-2);const map=new Map();for(let r=Math.max(0,H-2);r<=Math.min(data.length-1,H+2);r++)for(let c=0;c<(data[r]||[]).length;c++){const d=valISO(data[r][c]);if(d&&!map.has(d))map.set(d,c)}return{hr:H,nc:N,cc:C,dates:[...map].map(([iso,col])=>({iso,col})).sort((a,b)=>a.iso.localeCompare(b.iso))}}async function parse(data){await loadX();const wb=XLSX.read(data,{type:'array',cellDates:true,cellFormula:true}),sh=wb.Sheets[SHEET];if(!sh)throw Error(`${SHEET}シートがありません`);const R=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null}),l=layout(R);return{rows:R,...l}}function monthDates(){const m=Number(month.value),matched=dates.filter(d=>Number(d.iso.slice(5,7))===m);if(!matched.length)return[];const y=Number(matched[0].iso.slice(0,4)),days=new Date(y,m,0).getDate(),map=new Map(matched.map(d=>[Number(d.iso.slice(8,10)),d]));return Array.from({length:days},(_,i)=>({day:i+1,date:map.get(i+1)||null,year:y,month:m}))}function people(){const a=[];if(!rows)return a;for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nc]);if(name&&isCode(row[cc]))a.push({name,row})}return a}function apply(p,name,when){rows=p.rows;hr=p.hr;nc=p.nc;cc=p.cc;dates=p.dates||[];const md=monthDates().filter(x=>x.date);if(md.length){date.min=md[0].date.iso;date.max=md.at(-1).date.iso;const t=iso(new Date());date.value=md.some(x=>x.date.iso===t)?t:md[0].date.iso}saved.hidden=false;savedName.textContent=name;savedAt.textContent=when?`保存日時：${new Date(when).toLocaleString('ja-JP')}`:'';meta.textContent=`${month.value}月：${name} を使用中`;fileLabel.textContent=`${month.value}月のExcelを更新`;del.disabled=false;setStatus(`${month.value}月用Excelを使用中`,'ok');show()}async function loadSelected(){rows=null;dates=[];result.hidden=true;monthResult.innerHTML='';const x=await get();if(!x){saved.hidden=true;meta.textContent=`${month.value}月：未登録`;fileLabel.textContent=`${month.value}月のExcelを登録`;del.disabled=true;setStatus(`${month.value}月のExcelは未登録です。`);return}try{if(x.parsed){apply(x.parsed,x.name,x.savedAt);return}const p=await parse(x.data);await put({...x,parsed:p});apply(p,x.name,x.savedAt)}catch(e){setStatus(`読み込みエラー：${e.message}`,'error')}}function show(){if(!rows||!date.value)return;const di=dates.find(d=>d.iso===date.value);result.hidden=false;if(!di){title.textContent='該当日なし';count.textContent='';list.innerHTML='<div class="empty">この日付はありません。</div>';return}const ps=people().map(p=>({name:p.name,shift:clean(p.row[di.col])})).filter(p=>!leave(p.shift)),d=new Date(`${date.value}T00:00:00`),wd=['日','月','火','水','木','金','土'][d.getDay()];title.textContent=`${d.getMonth()+1}月${d.getDate()}日（${wd}）`;count.textContent=`出勤 ${ps.length}名`;list.innerHTML=ps.length?ps.map(p=>`<div class="row"><div class="name">${esc(p.name)}</div><div class="shift">${esc(p.shift)}</div></div>`).join(''):'<div class="empty">出勤者なし</div>'}function showMonth(){if(!rows){monthResult.innerHTML='<div class="empty">この月のExcelを登録してください。</div>';return}const qs=nameSearch.value.split(/[、,，\n]+/).map(s=>s.trim()).filter(Boolean);if(!qs.length){monthResult.innerHTML='<div class="empty">名前を入力してください。</div>';return}const all=people(),ps=[];for(const q of qs)for(const p of all)if(p.name.includes(q)&&!ps.includes(p))ps.push(p);const cal=monthDates();if(!ps.length){monthResult.innerHTML='<div class="empty">該当スタッフなし</div>';return}if(!cal.length){monthResult.innerHTML='<div class="empty">この月の日付が見つかりません。</div>';return}const y=cal[0].year,m=cal[0].month,first=new Date(y,m-1,1).getDay(),dows=['日','月','火','水','木','金','土'];monthResult.innerHTML=`<div class="meta">${ps.length}名表示</div>`+ps.map(p=>{let cells=Array.from({length:first},()=>'<div class="day blank"></div>');cells.push(...cal.map(x=>{const dow=new Date(y,m-1,x.day).getDay(),s=x.date?clean(p.row[x.date.col]):'',cls=dow===0?' sun':dow===6?' sat':'';return`<div class="day${cls}"><div class="num">${x.day}</div><div class="calShift ${leave(s)?'off':''}">${esc(s||'')}</div></div>`}));while(cells.length%7)cells.push('<div class="day blank"></div>');return`<div class="person"><h3>${esc(p.name)}　${m}月</h3><div class="calendar">${dows.map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}${cells.join('')}</div></div>`}).join('')}file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{setStatus('Excelを解析中…');const data=await f.arrayBuffer(),p=await parse(data),savedAt=new Date().toISOString();await put({data,name:f.name,savedAt,parsed:p});apply(p,f.name,savedAt);setStatus(`${month.value}月用として保存しました。`,'ok')}catch(e){setStatus(`読み込みエラー：${e.message}`,'error')}finally{file.value=''}};month.onchange=loadSelected;del.onclick=async()=>{if(confirm(`${month.value}月の登録Excelを削除しますか？`)){await remove();await loadSelected()}};dailyTab.onclick=()=>{dailyPanel.hidden=false;monthPanel.hidden=true;dailyTab.classList.add('active');monthTab.classList.remove('active')};monthTab.onclick=()=>{dailyPanel.hidden=true;monthPanel.hidden=false;dailyTab.classList.remove('active');monthTab.classList.add('active')};$('monthSearchBtn').onclick=showMonth;nameSearch.onkeydown=e=>{if(e.key==='Enter')showMonth()};date.onchange=show;$('todayBtn').onclick=()=>{const t=iso(new Date());if(t>=date.min&&t<=date.max){date.value=t;show()}};function move(n){if(!date.value)return;const d=new Date(`${date.value}T00:00:00`);d.setDate(d.getDate()+n);const v=iso(d);if(v>=date.min&&v<=date.max){date.value=v;show()}}$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('refreshLatestBtn').onclick=()=>{const u=new URL(location.href);u.searchParams.set('_refresh',Date.now());location.replace(u)};loadSelected().catch(e=>setStatus(`読み込みエラー：${e.message}`,'error'))})();</script></body></html>
