<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全スタッフ シフト確認</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(720px,calc(100% - 24px));margin:22px auto 40px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 32px rgba(15,23,42,.08)}h1{font-size:25px;margin:0 0 5px}.sub{font-size:13px;color:#64748b;margin:0 0 20px}.saved{padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:12px}.saved b{display:block;font-size:14px}.saved small{color:#64748b}.fileLabel,button{display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:800;text-align:center;cursor:pointer}.fileLabel{background:#eaf2ff;color:#175cd3}input[type=file]{display:none}.status{font-size:13px;padding:11px 13px;border-radius:12px;background:#f1f5f9;margin:12px 0 18px;line-height:1.5}.status.ok{background:#ecfdf3;color:#067647}.status.error{background:#fef3f2;color:#b42318}.field{margin:14px 0}.field label{display:block;font-weight:800;margin:0 0 7px}.field input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:17px}.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 16px}.quick button{padding:11px 8px;background:#f1f5f9;color:#334155;font-size:14px}.result{margin-top:18px}.titleRow{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.titleRow h2{font-size:20px;margin:0}.count{font-size:13px;color:#64748b;white-space:nowrap}.list{border:1px solid #e2e8f0;border-radius:15px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 15px;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.name{font-weight:800}.shift{min-width:72px;text-align:center;padding:7px 10px;border-radius:999px;background:#eef2ff;font-weight:800}.empty{padding:24px;text-align:center;color:#64748b}.note{font-size:12px;color:#64748b;line-height:1.6;margin-top:15px}.todayMe{margin-top:14px;padding:14px 15px;border-radius:14px;background:#111827;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}.todayMe strong{font-size:16px}.badge{background:rgba(255,255,255,.16);padding:7px 10px;border-radius:999px;font-weight:800;white-space:nowrap}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>全スタッフ シフト確認</h1><p class="sub">Excelを一度登録すれば、次回から日付を選ぶだけで確認できます。</p>
<div id="saved" class="saved" hidden><small>現在のシフト表</small><b id="savedName"></b><small id="savedAt"></small></div>
<label class="fileLabel" for="excelFile" id="fileLabel">シフト表Excelを登録</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsm">
<div id="status" class="status">初回だけシフト表Excelを登録してください。</div>
<div class="field"><label for="targetDate">確認する日付</label><input id="targetDate" type="date"></div>
<div class="quick"><button id="prevBtn" type="button">← 前日</button><button id="todayBtn" type="button">今日</button><button id="nextBtn" type="button">翌日 →</button></div>
<div id="meBox" class="todayMe" hidden><strong>深澤</strong><span id="meShift" class="badge"></span></div>
<div id="result" class="result" hidden><div class="titleRow"><h2 id="resultTitle"></h2><span id="count" class="count"></span></div><div id="staffList" class="list"></div></div>
<p class="note">部門に関係なく、シフト表に登録されている全スタッフを表示します。公休・有休などは出勤者から除外します。翌月は新しいExcelに更新するだけで使えます。</p>
</section></main>
<script>
(()=>{
const SHEET_NAME="3）入力用", SELF_NAME="深澤";
const DB_NAME="ShiftViewerAllDB", STORE="files", KEY="currentShiftAll";
const fileInput=document.getElementById('excelFile'), dateInput=document.getElementById('targetDate'), statusBox=document.getElementById('status'), result=document.getElementById('result'), resultTitle=document.getElementById('resultTitle'), count=document.getElementById('count'), staffList=document.getElementById('staffList'), saved=document.getElementById('saved'), savedName=document.getElementById('savedName'), savedAt=document.getElementById('savedAt'), fileLabel=document.getElementById('fileLabel'), meBox=document.getElementById('meBox'), meShift=document.getElementById('meShift');
let rows=null, headerRow=-1, nameCol=-1, codeCol=-1, dates=[];
const clean=v=>v==null?'':String(v).trim();
const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function serialISO(v){const p=XLSX.SSF.parse_date_code(Number(v));return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:null}
function valueISO(v){if(v instanceof Date&&!isNaN(v))return localISO(v);if(typeof v==='number'&&v>30000&&v<80000)return serialISO(v);if(typeof v==='string'){let m=v.trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}return null}
function isCode(v){return typeof v==='number'?Number.isFinite(v):typeof v==='string'&&/^\d+$/.test(v.trim())}
function setStatus(t,c=''){statusBox.className=`status ${c}`.trim();statusBox.textContent=t}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function saveFile(data,name){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({data,name,savedAt:new Date().toISOString()},KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function loadFile(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
function findLayout(data){let hr=-1,nc=-1,cc=-1;for(let r=0;r<Math.min(data.length,100);r++){for(let c=0;c<(data[r]||[]).length;c++){if(clean(data[r][c]).includes('担当者名')){hr=r;nc=c;break}}if(hr>=0)break}if(hr<0)throw new Error('「担当者名」の列を見つけられませんでした。');for(let c=0;c<(data[hr]||[]).length;c++){if(clean(data[hr][c])==='CD'){cc=c;break}}if(cc<0)cc=Math.max(0,nc-2);const map=new Map();for(let r=Math.max(0,hr-2);r<=Math.min(data.length-1,hr+2);r++){for(let c=0;c<(data[r]||[]).length;c++){const iso=valueISO(data[r][c]);if(iso&&!map.has(iso))map.set(iso,c)}}const ds=[...map].map(([iso,col])=>({iso,col})).sort((a,b)=>a.iso.localeCompare(b.iso));if(!ds.length)throw new Error('日付列を見つけられませんでした。');return{hr,nc,cc,ds}}
async function parse(data,name,when){const wb=XLSX.read(data,{type:'array',cellDates:true,cellFormula:true});const sh=wb.Sheets[SHEET_NAME];if(!sh)throw new Error(`「${SHEET_NAME}」シートがありません。`);rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:null});const l=findLayout(rows);headerRow=l.hr;nameCol=l.nc;codeCol=l.cc;dates=l.ds;dateInput.min=dates[0].iso;dateInput.max=dates.at(-1).iso;const today=localISO(new Date());dateInput.value=dates.some(x=>x.iso===today)?today:dates[0].iso;saved.hidden=false;savedName.textContent=name;savedAt.textContent=when?`保存日時：${new Date(when).toLocaleString('ja-JP')}`:'';fileLabel.textContent='シフト表Excelを更新';setStatus(`使用中：${dates[0].iso.replaceAll('-','/')} ～ ${dates.at(-1).iso.replaceAll('-','/')}`,'ok');show()}
function escapeHTML(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function show(){if(!rows)return;const target=dateInput.value,di=dates.find(d=>d.iso===target);result.hidden=false;if(!di){resultTitle.textContent='該当日なし';count.textContent='';staffList.innerHTML='<div class="empty">このExcelにその日付はありません。</div>';meBox.hidden=true;return}let people=[];for(let r=headerRow+1;r<rows.length;r++){const row=rows[r]||[],name=clean(row[nameCol]),code=row[codeCol];if(!name||!isCode(code))continue;const shift=clean(row[di.col]);const leave=['休','公休','有休','有給','希望休','欠勤','休日','振休','代休'];if(shift&&!leave.some(w=>shift===w||shift.includes(w)))people.push({name,shift})}const d=new Date(`${target}T00:00:00`),wd=['日','月','火','水','木','金','土'][d.getDay()];resultTitle.textContent=`${d.getMonth()+1}月${d.getDate()}日（${wd}）`;count.textContent=`出勤 ${people.length}名`;staffList.innerHTML=people.length?people.map(p=>`<div class="row"><div class="name">${escapeHTML(p.name)}</div><div class="shift">${escapeHTML(p.shift)}</div></div>`).join(''):'<div class="empty">出勤者が見つかりませんでした。</div>';const me=people.find(p=>p.name.includes(SELF_NAME));meBox.hidden=!me;if(me)meShift.textContent=me.shift}
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;try{setStatus('Excelを読み込んでいます…');const data=await f.arrayBuffer();await parse(data,f.name);await saveFile(data,f.name);savedAt.textContent=`保存日時：${new Date().toLocaleString('ja-JP')}`;setStatus('シフト表を保存しました。次回から自動で読み込みます。','ok')}catch(e){setStatus(`読み込みエラー：${e.message}`,'error')}finally{fileInput.value=''}});
dateInput.addEventListener('change',show);document.getElementById('todayBtn').onclick=()=>{const t=localISO(new Date());if(t>=dateInput.min&&t<=dateInput.max){dateInput.value=t;show()}};function move(n){if(!dateInput.value)return;const d=new Date(`${dateInput.value}T00:00:00`);d.setDate(d.getDate()+n);const v=localISO(d);if(v>=dateInput.min&&v<=dateInput.max){dateInput.value=v;show()}}document.getElementById('prevBtn').onclick=()=>move(-1);document.getElementById('nextBtn').onclick=()=>move(1);
dateInput.value=localISO(new Date());(async()=>{try{const x=await loadFile();if(x)await parse(x.data,x.name,x.savedAt)}catch(e){setStatus('保存済みExcelを読み込めませんでした。再登録してください。','error')}})();
})();
</script></body></html>
